<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{desc}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#0a0a0b">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ASB Media Group">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{desc}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="https://www.asbmediagroup.com/{{og}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://player.vimeo.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>document.documentElement.classList.add("js");try{if(sessionStorage.getItem("asb-wipe")&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("is-entering")}catch(e){}</script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "ASB Media Group",
    "description": "Commercial video production and photography studio in Tampa Bay — brand anthem films, product showcases, social ad campaigns, weddings and sports.",
    "url": "https://www.asbmediagroup.com/",
    "email": "aramisbooker@asbmediagroup.com",
    "telephone": "+1-813-607-0444",
    "founder": { "@type": "Person", "name": "Aramis Booker" },
    "areaServed": ["Tampa", "St. Petersburg", "Clearwater", "Lakeland", "Sarasota", "Central Florida"],
    "address": { "@type": "PostalAddress", "addressLocality": "Tampa", "addressRegion": "FL", "addressCountry": "US" },
    "image": "https://www.asbmediagroup.com/assets/img/film-funbike.webp"
  }
  </script>
  {{schema}}
</head>
