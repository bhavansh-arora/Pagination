<body class="{{bodyclass}}">
  <a class="skip" href="#main">Skip to content</a>
{{loader}}
  <div class="wipe" aria-hidden="true"><div class="wipe__panel"></div><div class="wipe__panel wipe__panel--ink"></div></div>

  <div class="grain" aria-hidden="true"></div>

  <header class="header">
    <div class="wrap header__inner">

        <span class="logo__text"><span class="logo__name">ASB Media</span><span class="logo__sub">Group · Tampa Bay</span></span>
      </a>
      <nav class="nav" aria-label="Primary">
          {{nav}}
      </nav>
      <div class="header__cta">
        <a class="btn btn--sm" href="contact.html" data-magnetic=".25">Start a project {{icon:arrow}}</a>
        <button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span class="menu-btn__lines"><span></span><span></span></span></button>
      </div>
    </div>
  </header>

  <div class="menu" id="menu" aria-hidden="true">
    <div class="wrap menu__inner">
      <nav class="menu__list" aria-label="Menu">
        <div class="menu__item"><a class="menu__link" href="index.html" data-preview="home"><span class="mono">01</span>Home</a></div>

        <div class="menu__item"><a class="menu__link" href="weddings.html" data-preview="weddings"><span class="mono">04</span>Weddings</a></div>
        <div class="menu__item"><a class="menu__link" href="photography.html" data-preview="stills"><span class="mono">05</span>Stills</a></div>
        <div class="menu__item"><a class="menu__link" href="about.html" data-preview="about"><span class="mono">06</span>Studio</a></div>
        <div class="menu__item"><a class="menu__link" href="contact.html" data-preview="contact"><span class="mono">07</span>Contact</a></div>

        <div class="menu__preview">
          <img data-key="home" class="is-active" src="assets/img/film-funbike-sm.webp" alt="" loading="lazy">

          <img data-key="services" src="assets/img/film-teco-sm.webp" alt="" loading="lazy">
