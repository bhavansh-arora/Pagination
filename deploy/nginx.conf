# Non-Docker install: copy to /etc/nginx/sites-available/mindclone, replace example.com,
# symlink into sites-enabled, then run: sudo certbot --nginx -d example.com
server {
    listen 80;
    server_name example.com;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (don't append) so clients can't spoof their IP for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat replies stream token by token.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
