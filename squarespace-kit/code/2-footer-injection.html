<script>
/* Contact page: move the Squarespace Form block into the design's form panel,
   so inquiries go through Squarespace (and Dan's connected integrations). */
(function () {
  var slot = document.getElementById("sq-form-slot");
  if (!slot) return;
  var form = document.querySelector(".sqs-block-form");
  if (!form) return;
  var holder = form.closest(".fe-block");
  slot.appendChild(form);
  if (holder) holder.style.display = "none";
})();
</script>
