<!--
  Dan Reynolds Photography: Squarespace code injection
  Turns the custom look (custom.css) on, one page at a time while you build, then site-wide at launch.

  ─────────────────────────────────────────────────────────────────────────────
  WHILE BUILDING: paste ONE of these into each NEW page only:
    Pages → hover the page → ⚙ (Page settings) → Advanced → Page Header Code Injection
  ─────────────────────────────────────────────────────────────────────────────

  For the new HOME page (gives the extra-large hero headline):
-->
