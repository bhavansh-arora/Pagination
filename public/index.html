<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Local Leads Finder</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Local Leads Finder</h1>
    <p class="subtitle">Find businesses by category &amp; location that have no website, or a weak one.</p>
    <p class="subtitle">Only businesses with a phone number are shown — no way to call or message means no usable lead.</p>
  </header>

  <main>
    <form id="search-form">
      <input id="category" type="text" placeholder="Category, e.g. salon" required />
      <input id="location" type="text" placeholder="Location, e.g. Bhopal" required />
      <button type="submit" id="search-btn">Search</button>
    </form>

    <div id="status" class="status"></div>

    <div class="toolbar">
      <label class="filter-toggle">
        <input type="checkbox" id="boost-mode" />
        🚀 Boost Mode — only show leads with no website or a weak one
      </label>
      <button id="export-btn" type="button" disabled>Export CSV</button>
      <button id="load-more-btn" type="button" style="display:none;">Load more results</button>
    </div>

    <div class="toolbar crm-toolbar">
      <span id="selected-count" class="selected-count">0 selected</span>
      <select id="crm-source-select">
        <option value="">Loading sources…</option>
      </select>
      <input id="crm-source-new" type="text" placeholder="New source name" style="display:none;" />
      <button id="push-crm-btn" type="button" disabled>Push selected to CRM</button>
    </div>

    <table id="results-table" style="display:none;">
      <thead>
        <tr>
          <th><input type="checkbox" id="select-all-th" title="Select all visible" /></th>
          <th>Business</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Rating</th>
          <th>Auto suggestion</th>
          <th>Visit site</th>
          <th>Manual review</th>
          <th>CRM</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </main>

  <script src="app.js"></script>
</body>
</html>
